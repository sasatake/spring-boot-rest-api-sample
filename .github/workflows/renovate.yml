name: Renovate

on:
  schedule:
    # 毎週月曜 07:00 JST (= 日曜 22:00 UTC)
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'PR やブランチを作らず、検出結果をログに出すだけにする'
        type: boolean
        default: false

# Renovate は RENOVATE_TOKEN(PAT) で動作するため GITHUB_TOKEN の権限は不要
permissions: {}

# 前回の実行と重ならないようにする(同じブランチを二重に作らないため)
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dry run と通常実行でステップを分けている。
      # RENOVATE_DRY_RUN は 'extract' / 'lookup' / 'full' を取り、
      # 空文字を渡した場合の扱いが保証されていないため、環境変数自体を出し分ける。
      - name: Run Renovate (dry run)
        if: inputs.dryRun
        uses: renovatebot/github-action@v46.3.4
        with:
          configurationFile: .github/renovate-global.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: debug
          RENOVATE_DRY_RUN: full

      - name: Run Renovate
        if: ${{ !inputs.dryRun }}
        uses: renovatebot/github-action@v46.3.4
        with:
          configurationFile: .github/renovate-global.js
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
